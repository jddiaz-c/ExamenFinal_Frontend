<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corporate Solutions — Empleados</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <h1>Corporate Solutions</h1>
                <span>Sistema de incapacidades</span>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <i class="ti ti-layout-dashboard" aria-hidden="true"></i>
                    Dashboard
                </a>
                <a href="empleados.html" class="nav-item active">
                    <i class="ti ti-users" aria-hidden="true"></i>
                    Empleados
                </a>
                <a href="incapacidades.html" class="nav-item">
                    <i class="ti ti-file-medical" aria-hidden="true"></i>
                    Incapacidades
                </a>
                <a href="seguimiento.html" class="nav-item">
                    <i class="ti ti-timeline" aria-hidden="true"></i>
                    Seguimiento
                </a>
                <a href="usuarios.html" class="nav-item" id="nav-usuarios">
                    <i class="ti ti-shield" aria-hidden="true"></i>
                    Usuarios
                </a>
            </nav>
        </aside>
        <div class="main">
            <header class="header">
                <h2>Empleados</h2>
                <div class="header-user">
                    <div class="user-info">
                        <div class="user-avatar" id="user-avatar"></div>
                        <div>
                            <p id="user-nombre"></p>
                            <span id="user-rol"></span>
                        </div>
                        <i class="ti ti-chevron-down" aria-hidden="true"></i>
                    </div>
                    <button class="btn-logout" id="btn-logout" aria-label="Cerrar sesión">
                        <i class="ti ti-logout" aria-hidden="true"></i>
                    </button>
                </div>
            </header>
            <main class="content">
                <div class="card">
                    <div class="search-bar">
                        <input type="text" id="buscar-input" placeholder="Buscar por documento, área o estado...">
                        <select id="filtro-estado">
                            <option value="">Todos los estados</option>
                            <option value="activo">Activo</option>
                            <option value="inactivo">Inactivo</option>
                        </select>
                        <button class="btn btn-secondary btn-sm" id="btn-buscar">
                            <i class="ti ti-search" aria-hidden="true"></i>
                            Buscar
                        </button>
                        <button class="btn btn-primary btn-sm" id="btn-nuevo">
                            <i class="ti ti-plus" aria-hidden="true"></i>
                            Nuevo empleado
                        </button>
                    </div>
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>Nombre</th>
                                    <th>Documento</th>
                                    <th>Cargo</th>
                                    <th>Área</th>
                                    <th>Fecha ingreso</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-empleados">
                                <tr>
                                    <td colspan="7" class="center-text">Cargando...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Modal crear/editar -->
    <div class="modal-overlay" id="modal-empleado">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-titulo">Nuevo empleado</h3>
                <button class="btn-close" id="btn-cerrar-modal">
                    <i class="ti ti-x" aria-hidden="true"></i>
                </button>
            </div>
            <div class="alert-error" id="modal-error"></div>
            <div class="form-grid">
                <div class="form-group">
                    <label for="nombres">Nombres</label>
                    <input type="text" id="nombres" placeholder="Nombres">
                </div>
                <div class="form-group">
                    <label for="apellidos">Apellidos</label>
                    <input type="text" id="apellidos" placeholder="Apellidos">
                </div>
                <div class="form-group">
                    <label for="documento">Documento</label>
                    <input type="text" id="documento" placeholder="Número de documento">
                </div>
                <div class="form-group">
                    <label for="correo">Correo</label>
                    <input type="email" id="correo" placeholder="correo@empresa.com">
                </div>
                <div class="form-group">
                    <label for="telefono">Teléfono</label>
                    <input type="text" id="telefono" placeholder="Teléfono">
                </div>
                <div class="form-group">
                    <label for="cargo">Cargo</label>
                    <input type="text" id="cargo" placeholder="Cargo">
                </div>
                <div class="form-group">
                    <label for="area">Área</label>
                    <input type="text" id="area" placeholder="Área">
                </div>
                <div class="form-group">
                    <label for="fecha_ingreso">Fecha de ingreso</label>
                    <input type="date" id="fecha_ingreso">
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="btn-cancelar">Cancelar</button>
                <button class="btn btn-primary" id="btn-guardar">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Modal cambiar estado -->
    <div class="modal-overlay" id="modal-estado">
        <div class="modal small">
            <div class="modal-header">
                <h3>Cambiar estado</h3>
                <button class="btn-close" id="btn-cerrar-estado">
                    <i class="ti ti-x" aria-hidden="true"></i>
                </button>
            </div>
            <p>Selecciona el nuevo estado del empleado.</p>
            <div class="form-group">
                <label for="nuevo-estado">Estado</label>
                <select id="nuevo-estado">
                    <option value="activo">Activo</option>
                    <option value="inactivo">Inactivo</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="btn-cancelar-estado">Cancelar</button>
                <button class="btn btn-primary" id="btn-guardar-estado">Guardar</button>
            </div>
        </div>
    </div>

    <script src="js/config/api.js"></script>
    <script src="js/services/empleadosService.js"></script>
    <script src="js/utils/auth.js"></script>
    <script src="js/pages/empleados.js"></script>
</body>
</html>
