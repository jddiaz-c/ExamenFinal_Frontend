<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corporate Solutions — Incapacidades</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <h1>Corporate Solutions</h1>
                <span>Sistema de incapacidades</span>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <i class="ti ti-layout-dashboard" aria-hidden="true"></i>
                    Dashboard
                </a>
                <a href="empleados.html" class="nav-item">
                    <i class="ti ti-users" aria-hidden="true"></i>
                    Empleados
                </a>
                <a href="incapacidades.html" class="nav-item active">
                    <i class="ti ti-file-medical" aria-hidden="true"></i>
                    Incapacidades
                </a>
                <a href="seguimiento.html" class="nav-item">
                    <i class="ti ti-timeline" aria-hidden="true"></i>
                    Seguimiento
                </a>
                <a href="usuarios.html" class="nav-item" id="nav-usuarios">
                    <i class="ti ti-shield" aria-hidden="true"></i>
                    Usuarios
                </a>
            </nav>
        </aside>
        <div class="main">
            <header class="header">
                <h2>Incapacidades</h2>
                <div class="header-user">
                    <div class="user-info">
                        <div class="user-avatar" id="user-avatar"></div>
                        <div>
                            <p id="user-nombre"></p>
                            <span id="user-rol"></span>
                        </div>
                        <i class="ti ti-chevron-down" aria-hidden="true"></i>
                    </div>
                    <button class="btn-logout" id="btn-logout" aria-label="Cerrar sesión">
                        <i class="ti ti-logout" aria-hidden="true"></i>
                    </button>
                </div>
            </header>
            <main class="content">
                <div class="card">
                    <div class="search-bar">
                        <div class="search-row">
                            <input type="text" id="buscar-input" placeholder="Buscar por empleado...">
                            <select id="filtro-estado">
                                <option value="">Todos los estados</option>
                                <option value="registrada">Registrada</option>
                                <option value="en_revision">En revisión</option>
                                <option value="aprobada">Aprobada</option>
                                <option value="rechazada">Rechazada</option>
                                <option value="finalizada">Finalizada</option>
                            </select>
                            <select id="filtro-tipo">
                                <option value="">Todos los tipos</option>
                                <option value="enfermedad_general">Enfermedad general</option>
                                <option value="accidente_laboral">Accidente laboral</option>
                                <option value="licencia_medica">Licencia médica</option>
                                <option value="incapacidad_temporal">Incapacidad temporal</option>
                            </select>
                            <button class="btn btn-primary btn-sm" id="btn-nueva">
                                <i class="ti ti-plus" aria-hidden="true"></i>
                                Nueva incapacidad
                            </button>
                        </div>
                        <div class="search-row">
                            <label class="filter-label">Desde</label>
                            <input type="date" id="filtro-fecha-inicio">
                            <label class="filter-label">Hasta</label>
                            <input type="date" id="filtro-fecha-fin">
                        </div>
                    </div>
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>Empleado</th>
                                    <th>Tipo</th>
                                    <th>Fecha inicio</th>
                                    <th>Fecha fin</th>
                                    <th>Días</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-incapacidades">
                                <tr>
                                    <td colspan="7" class="center-text">Cargando...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Modal crear/editar -->
    <div class="modal-overlay" id="modal-incapacidad">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-titulo">Nueva incapacidad</h3>
                <button class="btn-close" id="btn-cerrar-modal">
                    <i class="ti ti-x" aria-hidden="true"></i>
                </button>
            </div>
            <div class="alert-error" id="modal-error"></div>
            <div class="form-grid">
                <div class="form-group">
                    <label for="empleado_id">Empleado</label>
                    <select id="empleado_id"></select>
                </div>
                <div class="form-group">
                    <label for="tipo">Tipo</label>
                    <select id="tipo">
                        <option value="enfermedad_general">Enfermedad general</option>
                        <option value="accidente_laboral">Accidente laboral</option>
                        <option value="licencia_medica">Licencia médica</option>
                        <option value="incapacidad_temporal">Incapacidad temporal</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="fecha_inicio">Fecha inicio</label>
                    <input type="date" id="fecha_inicio">
                </div>
                <div class="form-group">
                    <label for="fecha_fin">Fecha fin</label>
                    <input type="date" id="fecha_fin">
                </div>
                <div class="form-group">
                    <label for="entidad_medica">Entidad médica</label>
                    <input type="text" id="entidad_medica" placeholder="Nombre de la entidad">
                </div>
                <div class="form-group">
                    <label for="diagnostico_general">Diagnóstico general</label>
                    <input type="text" id="diagnostico_general" placeholder="Diagnóstico">
                </div>
            </div>
            <div class="form-group">
                <label for="observaciones">Observaciones</label>
                <textarea id="observaciones" rows="3" placeholder="Observaciones adicionales..."></textarea>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="btn-cancelar">Cancelar</button>
                <button class="btn btn-primary" id="btn-guardar">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Modal cambiar estado -->
    <div class="modal-overlay" id="modal-estado">
        <div class="modal modal-sm">
            <div class="modal-header">
                <h3>Cambiar estado</h3>
                <button class="btn-close" id="btn-cerrar-estado">
                    <i class="ti ti-x" aria-hidden="true"></i>
                </button>
            </div>
            <p class="modal-desc">Selecciona el nuevo estado de la incapacidad.</p>
            <div class="form-group">
                <label for="nuevo-estado">Estado</label>
                <select id="nuevo-estado">
                    <option value="registrada">Registrada</option>
                    <option value="en_revision">En revisión</option>
                    <option value="aprobada">Aprobada</option>
                    <option value="rechazada">Rechazada</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="btn-cancelar-estado">Cancelar</button>
                <button class="btn btn-primary" id="btn-guardar-estado">Guardar</button>
            </div>
        </div>
    </div>

    <script src="js/config/api.js"></script>
    <script src="js/services/authService.js"></script>
    <script src="js/services/empleadosService.js"></script>
    <script src="js/services/incapacidadesService.js"></script>
    <script src="js/utils/auth.js"></script>
    <script src="js/pages/incapacidades.js"></script>
</body>
</html>
